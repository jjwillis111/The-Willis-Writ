<div id="viewport">
  <div id="room">
    <div id="bgblur"></div>
    <div id="world"></div>
    <div id="hud">
      <header id="top">
        <div class="brandrow">
          <h1 id="brand">Jackson Willis</h1>
          <span class="bar"></span>
          <p id="tag">J.D. Candidate, Boston University School of Law</p>
        </div>
        <nav id="nav" aria-label="Portfolio volumes"></nav>
      </header>
      <section id="hero">
        <h2>Welcome to my library.</h2>
        <div class="hr"></div>
        <p>Pick a book from the shelf for my experience, writing and research, <br>or open the globe for today&rsquo;s legal news.</p>
      </section>
    </div>
  </div>

  <div id="fx"></div>
  <div id="fly"></div>

  <div id="stage" role="dialog" aria-modal="true" aria-hidden="true">
    <div id="dim"></div>
    <div id="mount"></div>
    <div class="ui" id="uitop">
      <span id="vtitle"></span>
      <button class="cbtn" id="btn-close" type="button">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
        Return to shelf
      </button>
    </div>
    <div class="ui" id="uibot">
      <button class="cbtn nbtn" id="btn-prev" type="button" aria-label="Previous pages">&#8249;</button>
      <span id="plabel" aria-live="polite"></span>
      <button class="cbtn nbtn" id="btn-next" type="button" aria-label="Next pages">&#8250;</button>
      <div id="viewmodes" role="group" aria-label="Reading view">
        <button class="cbtn vm on" type="button" data-mode="one" aria-pressed="true" aria-label="One page at a time">Page</button>
        <button class="cbtn vm" type="button" data-mode="open" aria-pressed="false" aria-label="Book fully open, upright">Open</button>
        <button class="cbtn vm" type="button" data-mode="turn" aria-pressed="false" aria-label="Book fully open, turned on its side">Sideways</button>
      </div>
    </div>
  </div>
</div>
